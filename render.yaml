# Render service manifest for aw-abetpdf. Import via Render → New → Blueprint
# (host this file publicly) or apply from the dashboard.
#
# All envVars have `sync: false` — values are not committed here. Set
# them in your Render service's Environment tab, or in a shared env group
# if multiple services need the same secret.
services:
  - type: web
    name: aw-abetpdf
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_APP_URL
        sync: false       # this service's own public origin, no trailing slash
      - key: NEXT_PUBLIC_STRIPE_PAYMENT_LINK
        sync: false       # optional; pricing page renders inert without it
